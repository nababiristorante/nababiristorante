<style>
.logo-placement-options{display:grid;gap:12px;margin-top:14px}.logo-placement-options label{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid rgba(216,183,106,.25);border-radius:10px;background:rgba(16,45,36,.25)}.logo-placement-options input{width:18px;height:18px;accent-color:#d8b76a}.top-brand{display:flex;align-items:center;gap:8px}
/* LOGIN PAGE REDESIGN ONLY — admin dashboard styles remain unchanged */
#loginScreen.login-screen{position:relative;isolation:isolate;overflow:hidden;min-height:100svh;padding:28px 18px;background:radial-gradient(ellipse at 15% 12%,rgba(36,105,72,.55),transparent 42%),radial-gradient(ellipse at 90% 88%,rgba(193,145,53,.18),transparent 38%),linear-gradient(145deg,#07130f 0%,#09100e 52%,#050908 100%)}
#loginScreen.login-screen:before,#loginScreen.login-screen:after{content:"";position:absolute;z-index:-1;border:1px solid rgba(224,190,111,.16);border-radius:50%;width:430px;height:430px;pointer-events:none}
#loginScreen.login-screen:before{top:-270px;right:-140px}
#loginScreen.login-screen:after{bottom:-320px;left:-170px;width:520px;height:520px}
#loginScreen .login-card{width:min(100%,440px);padding:clamp(25px,6vw,42px);border:1px solid rgba(220,190,119,.42);border-radius:26px;background:linear-gradient(155deg,rgba(19,48,36,.97),rgba(8,17,14,.98) 58%,rgba(7,12,11,.99));box-shadow:0 28px 90px rgba(0,0,0,.55),inset 0 1px rgba(255,255,255,.06);backdrop-filter:blur(14px)}
#loginScreen .brand-mark{justify-content:center;gap:14px;margin:0 0 34px;color:#e8bd62;font-size:32px;letter-spacing:.4px}
#loginScreen .brand-mark>span{font-size:26px;line-height:1.05}
#loginScreen .brand-mark small{margin-top:5px;color:#e8dfc9;font-size:9px;letter-spacing:4px}
#loginScreen .eyebrow{text-align:center;color:#d8b76a;font-size:10px;letter-spacing:3px}
#loginScreen .login-card h1{margin:5px 0 27px;text-align:center;color:#fff7e8;font-size:clamp(29px,7vw,36px);font-weight:500;letter-spacing:-.5px}
#loginScreen .login-card label{display:grid;gap:9px;margin:17px 0;color:#e9dfc9;font-size:12px;font-weight:700;letter-spacing:.5px}
#loginScreen .login-card input{width:100%;min-height:52px;padding:14px 16px;border:1px solid rgba(213,190,139,.28);border-radius:13px;background:rgba(3,10,7,.72);color:#fff;font-size:16px;outline:none;transition:border-color .2s,box-shadow .2s}
#loginScreen .login-card input:focus{border-color:#e8bd62;box-shadow:0 0 0 3px rgba(232,189,98,.13)}
#loginScreen .gold-btn.full{min-height:53px;margin-top:16px;border-radius:13px;background:linear-gradient(105deg,#c99b42,#f3d887 55%,#d8ad55);box-shadow:0 9px 25px rgba(195,147,56,.18);font-size:14px;letter-spacing:.8px}
#loginScreen .gold-btn:disabled{opacity:.65}
#loginScreen #forgotPasswordBtn{display:block;width:100%;margin:16px 0 0;padding:8px;color:#e5c77f;text-align:center;font-size:12px}
#loginScreen #forgotPasswordBtn:hover,#loginScreen .muted-link:hover{color:#fff0c2}
#loginScreen #loginMessage{min-height:22px;margin:14px 0 5px;padding:0 4px;text-align:center;overflow-wrap:anywhere}
#loginScreen #passwordResetFields{margin-top:12px;padding-top:15px;border-top:1px solid rgba(220,190,119,.2)}
#loginScreen #passwordResetFields .help{text-align:center;color:#c8c4b7}
#loginScreen>a.muted-link{display:block;margin-top:14px;text-align:center;color:#c8c4b7}
@media(max-width:480px){#loginScreen.login-screen{padding:18px 14px}#loginScreen .login-card{padding:26px 21px;border-radius:22px}#loginScreen .brand-mark{margin-bottom:29px}}
</style>

<body class="admin-body">
<div id="loginScreen" class="login-screen"><form id="loginForm" class="login-card" novalidate><div class="brand-mark">♛ <span>Nababi<small>RISTORANTE</small></span></div><p class="eyebrow">AREA RISERVATA</p><h1>Admin Login</h1><div id="loginFields"><label for="email">EMAIL<input id="email" name="email" type="email" autocomplete="username" placeholder="nome@esempio.com" required></label><label for="password">PASSWORD<input id="password" name="password" type="password" autocomplete="current-password" placeholder="Inserisci la password" required></label><button class="gold-btn full" id="loginBtn" type="submit">Accedi</button><button class="muted-link" id="forgotPasswordBtn" type="button">Password dimenticata? Recuperala</button></div><div id="passwordResetFields" hidden><p class="help">Inserisci una nuova password per il tuo account.</p><label for="newPassword">NUOVA PASSWORD<input id="newPassword" type="password" autocomplete="new-password" minlength="8"></label><label for="confirmPassword">CONFERMA PASSWORD<input id="confirmPassword" type="password" autocomplete="new-password" minlength="8"></label><button class="gold-btn full" id="saveNewPasswordBtn" type="button">Salva nuova password</button></div><p id="loginMessage" class="notice" aria-live="polite" role="status"></p><a href="index.html" class="muted-link">← Torna al sito</a></form></div>
