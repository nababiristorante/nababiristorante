
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nababi Ristorante | Admin Panel</title>
<link rel="stylesheet" href="assets/style.css">

<style>
:root {
  --purple: #32134f;
  --deep-purple: #210b38;
  --gold: #d8b45c;
  --cream: #faf6ed;
  --white: #ffffff;
}

body {
  margin: 0;
  background: var(--cream);
  color: #30263a;
  font-family: Arial, sans-serif;
}

.admin-layout {
  display: flex;
  min-height: 100vh;
}

.sidebar {
  width: 270px;
  background: var(--deep-purple);
  color: white;
  padding: 20px 15px;
  flex-shrink: 0;
  box-sizing: border-box;
}

.sidebar-logo {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 8px;
  border-bottom: 1px solid #65477d;
  margin-bottom: 15px;
}

.sidebar-logo img {
  width: 58px;
  height: 58px;
  object-fit: contain;
  border-radius: 8px;
  background: white;
  padding: 3px;
}

.logo-fallback {
  width: 58px;
  height: 58px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--gold);
  color: var(--deep-purple);
  font-family: Georgia, serif;
  font-size: 30px;
  border-radius: 8px;
}

.logo-name {
  color: var(--gold);
  font-family: Georgia, serif;
  font-size: 21px;
}

.logo-name small {
  display: block;
  font-family: Arial, sans-serif;
  font-size: 9px;
  letter-spacing: 2px;
  margin-top: 5px;
  color: #eee2f5;
}

.logo-controls {
  padding: 0 8px 15px;
}

.logo-controls button {
  background: transparent;
  color: var(--gold);
  border: 1px solid var(--gold);
  border-radius: 6px;
  padding: 8px 12px;
  cursor: pointer;
  font-size: 12px;
}

.logo-controls button:hover {
  background: var(--gold);
  color: var(--deep-purple);
}

.sidebar nav button,
#logout {
  display: block;
  width: 100%;
  padding: 12px;
  margin: 4px 0;
  border: none;
  border-radius: 7px;
  background: transparent;
  color: white;
  text-align: left;
  font-size: 13px;
  cursor: pointer;
}

.sidebar nav button:hover,
.sidebar nav button.active,
#logout:hover {
  background: var(--gold);
  color: var(--deep-purple);
}

#logout {
  border: 1px solid #765b8c;
  margin-top: 20px;
}

.admin-main {
  flex: 1;
  padding: 25px;
  min-width: 0;
}

.admin-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 15px;
  margin-bottom: 25px;
}

.admin-header h1 {
  color: var(--purple);
  font-family: Georgia, serif;
}

.status {
  background: #e5f5e9;
  color: #14733c;
  padding: 9px 15px;
  border-radius: 20px;
  font-size: 12px;
}

.stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 15px;
}

.stat-card,
.content-card {
  background: var(--white);
  padding: 20px;
  border-radius: 12px;
  border: 1px solid #eadff0;
  margin-bottom: 15px;
  box-sizing: border-box;
}

.stat-card h2 {
  color: var(--gold);
  font-size: 30px;
  margin-top: 10px;
}

.content-card h2 {
  color: var(--purple);
  margin-bottom: 15px;
  font-family: Georgia, serif;
}

.content-card input,
.content-card textarea,
.content-card select {
  width: 100%;
  padding: 12px;
  margin: 6px 0;
  border: 1px solid #ddd;
  border-radius: 7px;
  font: inherit;
  box-sizing: border-box;
}

.save-button {
  background: var(--purple);
  color: var(--gold);
  border: none;
  border-radius: 7px;
  padding: 12px 20px;
  margin-top: 8px;
  cursor: pointer;
}

.save-button:hover {
  background: var(--deep-purple);
}

.login-box {
  max-width: 390px;
  background: white;
  padding: 30px;
  border-radius: 15px;
  margin: 100px auto;
  box-sizing: border-box;
}

.login-box input {
  width: 100%;
  padding: 13px;
  margin: 10px 0;
  border: 1px solid #ddd;
  border-radius: 7px;
  box-sizing: border-box;
}

#login-view {
  min-height: 100vh;
  padding: 20px;
  background: var(--deep-purple);
  box-sizing: border-box;
}

#login-view h1 {
  color: var(--purple);
  margin: 15px 0;
}

#login-error {
  color: #bd2929;
  font-size: 13px;
}

@media(max-width:900px) {
  .admin-layout {
    display: block;
  }

  .sidebar {
    width: 100%;
    padding: 12px;
  }

  .sidebar nav {
    display: flex;
    overflow-x: auto;
    gap: 5px;
  }

  .sidebar nav button {
    width: auto;
    white-space: nowrap;
  }

  .stats {
    grid-template-columns: repeat(2, 1fr);
  }

  .admin-main {
    padding: 15px;
  }

  .login-box {
    margin: 50px auto;
  }
}

@media(max-width:420px) {
  .stats {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<!-- ADMIN LOGIN -->
<div id="login-view">
  <div class="login-box">

    <div class="sidebar-logo">
      <div class="logo-fallback">N</div>
      <div class="logo-name">
        NABABI
        <small>ADMIN PANEL</small>
      </div>
    </div>

    <h1>Admin Login</h1>

    <form id="login-form">
      <input type="email" name="email"
        placeholder="Admin Email" required>

      <input type="password" name="password"
        placeholder="Password" required>

      <button class="save-button" type="submit">
        LOGIN
      </button>
    </form>

    <p id="login-error"></p>

    <p style="margin-top:15px">
      <a href="index.html">← Back to Website</a>
    </p>
  </div>
</div>

<!-- ADMIN DASHBOARD -->
<div id="admin-app" class="admin-layout" hidden>

  <aside class="sidebar">

    <div class="sidebar-logo">
      <img id="admin-logo"
        src=""
        alt="Nababi Ristorante Logo"
        hidden>

      <div id="admin-logo-fallback" class="logo-fallback">
        N
      </div>

      <div class="logo-name">
        NABABI
        <small>RISTORANTE ADMIN</small>
      </div>
    </div>

    <div class="logo-controls">
      <button type="button" id="change-logo">
        ✎ Change Logo
      </button>

      <input
        type="file"
        id="logo-file"
        accept="image/png,image/jpeg,image/webp"
        hidden
      >
    </div>

    <nav id="admin-nav">

      <button class="active" data-page="dashboard">▦ Dashboard</button>
      <button data-page="customers">♙ Customers</button>
      <button data-page="categories">▦ Categories</button>
      <button data-page="staff">♟ Staff Management</button>
      <button data-page="performance">▥ Staff Performance</button>
      <button data-page="attendance">◷ Staff Attendance</button>
      <button data-page="activity">☷ Staff Activity Log</button>
      <button data-page="tables">▤ Tavolo</button>
      <button data-page="coupons">％ Coupon Manager</button>
      <button data-page="website">◉ Website ON/OFF</button>
      <button data-page="delivery">➜ Food Delivery Link</button>
      <button data-page="hours">◷ Opening Hours</button>
      <button data-page="events">✧ Staff Event & Advice</button>
      <button data-page="messages">✉ Staff Message</button>
      <button data-page="breaking">⚡ Breaking News</button>

    </nav>

    <button id="logout">⇥ Logout</button>

  </aside>

  <main class="admin-main">

    <header class="admin-header">
      <div>
        <small style="color:#b38b37">
          NABABI RISTORANTE
        </small>
        <h1 id="page-title">Dashboard</h1>
      </div>

      <span class="status">● Admin Online</span>
    </header>

    <section id="page-content">

      <div class="stats">
        <div class="stat-card">
          Customers
          <h2>—</h2>
        </div>

        <div class="stat-card">
          Staff
          <h2>—</h2>
        </div>

        <div class="stat-card">
          Bookings
          <h2>—</h2>
        </div>

        <div class="stat-card">
          Coupons
          <h2>—</h2>
        </div>
      </div>

      <div class="content-card">
        <h2>Welcome to Nababi Ristorante</h2>
        <p>Manage your restaurant from one place.</p>
      </div>

    </section>

  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/config.js"></script>
<script src="assets/admin.js"></script>

</body>
</html>
