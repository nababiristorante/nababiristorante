
<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102d24">
<title>Nababi Staff Portal</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js"></script>

<style>
:root{--green:#102d24;--gold:#d8b76a;--cream:#f7f1e5}
*{box-sizing:border-box}
body{margin:0;background:#f5f1e8;color:#183e31;font:16px Arial}
header{background:var(--green);color:var(--cream);text-align:center;padding:25px}
.logo{font-size:27px;font-weight:bold;color:var(--gold);letter-spacing:4px}
.wrap{max-width:540px;margin:20px auto;padding:14px}
.card{background:white;border-radius:15px;padding:20px;margin-bottom:15px;box-shadow:0 3px 14px #0001}
input,select,button{width:100%;padding:13px;margin:7px 0;border:1px solid #ccc;border-radius:8px;font:inherit}
button{background:var(--green);color:white;border:0;font-weight:bold;cursor:pointer}
button.gold{background:var(--gold);color:#17251e}
button:disabled{opacity:.6;cursor:not-allowed}
img.profile{width:105px;height:105px;border-radius:50%;object-fit:cover;display:block;margin:10px auto;background:#eee}
h2{text-align:center}
.notice{background:#fff4d5;border-left:5px solid var(--gold);padding:12px;margin:10px 0;border-radius:5px}
.task{border-bottom:1px solid #eee;padding:12px 0}
.task:last-child{border-bottom:0}
#staffHome{display:none}
#message{color:#a33}
.brand{animation:appear 1.5s ease-in-out infinite alternate}
.muted{color:#68756d}
.status{padding:12px;background:#f5f1e8;border-radius:8px;line-height:1.7}
@keyframes appear{from{opacity:.55;transform:scale(.98)}to{opacity:1;transform:scale(1.04)}}
@media(max-width:600px){
 .wrap{margin:10px auto;padding:12px}
 .card{padding:17px}
}
</style>
</head>

<body>

<header>
 <div class="logo brand">NABABI</div>
 <div>RISTORANTE · STAFF PORTAL</div>
</header>

<div class="wrap">

<section id="login" class="card">
 <h2>Staff Login</h2>
 <p>আপনার নাম নির্বাচন করে Admin দেওয়া ৬ সংখ্যার PIN লিখুন।</p>

 <select id="staffSelect">
  <option value="">কর্মী নির্বাচন করুন</option>
 </select>

 <input id="pin" type="password" inputmode="numeric"
 maxlength="6" placeholder="৬ সংখ্যার PIN"
 autocomplete="off">

 <button id="loginBtn">Login</button>
 <p id="message" class="message"></p>
</section>

<main id="staffHome">

 <section class="card" style="text-align:center">
  <img id="photo" class="profile" alt="Staff photo">
  <h2 id="name"></h2>
  <p id="role"></p>
  <p id="phone"></p>
  <p id="email"></p>

  <div class="brand logo">NABABI</div>
  <p>Welcome to Nababi Ristorante</p>
 </section>

 <section class="card">
  <h2>Attendance</h2>

  <div id="attendanceStatus" class="status">
   আপনার হাজিরার অবস্থা এখানে দেখা যাবে।
  </div>

  <button id="checkIn">Check-in</button>
  <button id="checkOut" class="gold">Check-out</button>

  <p id="attendanceMessage" class="muted"></p>
 </section>

 <section class="card">
  <h2>Announcements</h2>
  <div id="announcements">কোনো ঘোষণা নেই।</div>
 </section>

 <section class="card">
  <h2>My Tasks</h2>
  <div id="tasks">কোনো নির্দেশনা নেই।</div>
 </section>

 <button id="logout">Logout</button>

</main>
</div>

<script>
(() => {
"use strict";

const cfg = window.NABABI_CONFIG || {};

const SUPABASE_URL = cfg.SUPABASE_URL;
const SUPABASE_ANON_KEY = cfg.SUPABASE_ANON_KEY;

const $ = id => document.getElementById(id);

let currentStaff = null;
let currentPin = null;

if (!window.supabase || !SUPABASE_URL || !SUPABASE_ANON_KEY) {
 $("message").textContent =
  "Supabase configuration পাওয়া যায়নি। config.js পরীক্ষা করুন।";
 return;
}

const db = window.supabase.createClient(
 SUPABASE_URL,
 SUPABASE_ANON_KEY
);

function setBusy(id,busy,text) {
 const button = $(id);

 if (busy) {
  button.dataset.oldText = button.textContent;
  button.disabled = true;
  button.textContent = text || "Please wait...";
 } else {
  button.disabled = false;
  button.textContent = button.dataset.oldText || button.textContent;
 }
}

function showMessage(id,message) {
 $(id).textContent = message || "";
}

function formatDate(value) {
 if (!value) return "এখনো হয়নি";

 const date = new Date(value);

 if (Number.isNaN(date.getTime())) return "তথ্য পাওয়া যায়নি";

 return date.toLocaleString("bn-BD",{
  dateStyle:"medium",
  timeStyle:"short"
 });
}

async function loadStaff() {
 showMessage("message","কর্মীদের তালিকা লোড হচ্ছে...");

 const {data,error} = await db.rpc("nababi_staff_active_list");

 if (error) {
  showMessage("message","কর্মীদের তালিকা লোড করা যায়নি। Supabase RPC পরীক্ষা করুন।");
  return;
 }

 const select = $("staffSelect");
 select.innerHTML = "";

 const first = new Option("কর্মী নির্বাচন করুন","");
 select.add(first);

 (data || []).forEach(s => {
  if (!s.id || !s.full_name) return;
  select.add(new Option(s.full_name,s.id));
 });

 showMessage("message","");
}

async function portalAction(action) {
 if (!currentStaff || !currentPin) {
  throw new Error("আবার Login করুন।");
 }

 const {data,error} = await db.rpc("nababi_staff_portal",{
  p_staff_id:currentStaff.id,
  p_pin:currentPin,
  p_action:action
 });

 if (error) throw error;

 if (!data || !data.success) {
  throw new Error("অনুরোধটি সম্পন্ন হয়নি। আবার চেষ্টা করুন।");
 }

 return data;
}

function renderTasks(tasks) {
 const container = $("tasks");
 container.innerHTML = "";

 if (!Array.isArray(tasks) || !tasks.length) {
  container.textContent = "কোনো নির্দেশনা নেই।";
  return;
 }

 tasks.forEach(task => {
  const div = document.createElement("div");
  div.className = "task";

  const heading = document.createElement("b");
  heading.textContent = task.title || "Task";

  const description = document.createElement("p");
  description.textContent = task.description || "";

  const due = document.createElement("small");
  due.className = "muted";
  due.textContent = task.due_at
   ? "শেষ সময়: " + formatDate(task.due_at)
   : "";

  div.append(heading,description,due);
  container.append(div);
 });
}

function renderAnnouncements(announcements) {
 const container = $("announcements");
 container.innerHTML = "";

 if (!Array.isArray(announcements) || !announcements.length) {
  container.textContent = "কোনো ঘোষণা নেই।";
  return;
 }

 announcements.forEach(item => {
  const div = document.createElement("div");
  div.className = "notice";

  const heading = document.createElement("b");
  heading.textContent = item.title || "Announcement";

  const message = document.createElement("p");
  message.textContent = item.message || "";

  div.append(heading,message);
  container.append(div);
 });
}

function showPortal(data) {
 if (!data || !data.staff) {
  throw new Error("Staff profile পাওয়া যায়নি।");
 }

 const staff = data.staff;
 currentStaff = {id:staff.id};

 $("login").style.display = "none";
 $("staffHome").style.display = "block";

 $("name").textContent = staff.full_name || "";
 $("role").textContent = staff.role || "";
 $("phone").textContent = staff.phone || "";
 $("email").textContent = staff.email || "";

 const photo = $("photo");

 if (staff.photo_url) {
  photo.src = staff.photo_url;
  photo.style.display = "block";
 } else {
  photo.removeAttribute("src");
  photo.style.display = "none";
 }

 $("attendanceStatus").textContent =
  "Check-in: " + formatDate(data.check_in) +
  " | Check-out: " + formatDate(data.check_out);

 renderTasks(data.tasks || []);
 renderAnnouncements(data.announcements || []);
}

$("loginBtn").onclick = async () => {
 const id = $("staffSelect").value;
 const pin = $("pin").value.trim();

 if (!id || !/^[0-9]{6}$/.test(pin)) {
  showMessage("message","কর্মী নির্বাচন করুন এবং ৬ সংখ্যার PIN লিখুন।");
  return;
 }

 setBusy("loginBtn",true,"Checking...");
 showMessage("message","Checking...");

 try {
  const {data,error} = await db.rpc("nababi_staff_portal",{
   p_staff_id:id,
   p_pin:pin,
   p_action:"login"
  });

  if (error) throw error;

  if (!data || !data.success || !data.staff) {
   throw new Error("Login সফল হয়নি। PIN পরীক্ষা করুন।");
  }

  currentPin = pin;
  currentStaff = {id};

  $("pin").value = "";

  showPortal(data);
  showMessage("attendanceMessage","");

 } catch(error) {
  currentPin = null;
  currentStaff = null;
  showMessage("message",error.message || "Login করা যায়নি।");
 } finally {
  setBusy("loginBtn",false);
 }
};

async function attendance(action) {
 if (!currentStaff) return;

 const buttonId = action === "checkin" ? "checkIn" : "checkOut";

 setBusy(buttonId,true,"Processing...");
 showMessage("attendanceMessage","Processing...");

 try {
  const data = await portalAction(action);

  showPortal(data);

  showMessage(
   "attendanceMessage",
   action === "checkin"
    ? "Check-in সফল হয়েছে।"
    : "Check-out সফল হয়েছে।"
  );

 } catch(error) {
  showMessage(
   "attendanceMessage",
   error.message || "Attendance আপডেট করা যায়নি।"
  );
 } finally {
  setBusy(buttonId,false);
 }
}

$("checkIn").onclick = () => attendance("checkin");
$("checkOut").onclick = () => attendance("checkout");

$("logout").onclick = () => {
 currentStaff = null;
 currentPin = null;

 $("pin").value = "";
 $("staffSelect").value = "";

 $("staffHome").style.display = "none";
 $("login").style.display = "block";

 showMessage("message","");
 showMessage("attendanceMessage","");

 $("tasks").innerHTML = "";
 $("announcements").innerHTML = "";
 $("photo").removeAttribute("src");
};

loadStaff();

})();
</script>

</body>
</html>
