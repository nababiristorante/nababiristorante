
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102d24">
  <title>Nababi Ristorante | Staff Attendance</title>

  <style>
:root{color-scheme:dark;--green:#0b211a;--green2:#12382b;--gold:#dfbf78;--cream:#f8f3e8}
*{box-sizing:border-box}
html{min-height:100%;background:var(--green)}
body{margin:0;min-height:100vh;padding:clamp(18px,4vw,42px) 14px 34px;background:radial-gradient(ellipse at 50% -10%,#315d45 0%,#173a2c 34%,#091b15 78%);color:var(--cream);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
.container{width:100%;max-width:560px;margin:0 auto}
.header{text-align:center;padding:12px 10px 28px}
.staff-brand-logo{display:block;width:min(220px,68vw);max-height:104px;object-fit:contain;margin:0 auto 14px}
.logo-mark{width:68px;height:68px;margin:0 auto 14px;display:grid;place-items:center;border:1.5px solid var(--gold);border-radius:50%;color:var(--gold);font-family:Georgia,serif;font-size:36px;box-shadow:0 0 0 6px #dfbf7812,0 10px 32px #0005}
.brand{margin:0;color:var(--gold);font-family:Georgia,"Times New Roman",serif;font-size:clamp(23px,5vw,30px);font-weight:600;letter-spacing:2.8px}
.subtitle{margin:9px 0 0;color:#e4d7b9;font-size:10px;letter-spacing:2.3px;font-weight:650}
.panel{position:relative;overflow:hidden;padding:clamp(22px,5vw,32px) clamp(16px,4vw,26px);border:1px solid #dfbf7880;border-radius:24px;background:linear-gradient(155deg,rgba(27,69,51,.98),rgba(12,37,28,.98));box-shadow:0 24px 70px #0007,inset 0 1px #ffffff12}
.panel:before{content:"";position:absolute;inset:0 0 auto;height:3px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
h2{margin:0 0 9px;color:var(--gold);text-align:center;font-family:Georgia,serif;font-size:clamp(22px,5vw,26px);font-weight:600}
.description{margin:0 0 24px;color:#e5dcc9;text-align:center;font-size:14px;line-height:1.65}
.staff-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.staff-card{min-width:0;min-height:160px;padding:17px 10px 15px;border:1px solid #dfbf7850;border-radius:18px;background:linear-gradient(160deg,#163e2e,#0c281e);color:var(--cream);cursor:pointer;text-align:center;box-shadow:0 8px 20px #0002;transition:transform .18s,border-color .18s,background .18s,box-shadow .18s}
.staff-card:hover,.staff-card:focus-visible{border-color:var(--gold);background:linear-gradient(160deg,#20543d,#103324);box-shadow:0 12px 28px #0004,0 0 0 3px #dfbf7818;outline:none;transform:translateY(-2px)}
.staff-card:active{transform:scale(.98)}
.staff-photo{width:92px;height:92px;margin:0 auto 12px;display:grid;place-items:center;overflow:hidden;border:2px solid var(--gold);border-radius:50%;background:#214b37;color:var(--gold);font-family:Georgia,serif;font-size:30px;box-shadow:0 0 0 5px #dfbf7817}
.staff-photo img{width:100%;height:100%;object-fit:cover}
.staff-name{display:block;overflow-wrap:anywhere;font-size:14px;font-weight:700;line-height:1.35}
.hidden{display:none!important}
.field-label{display:block;margin:22px 0 9px;color:var(--cream);font-size:14px;font-weight:650}
input{width:100%;padding:17px;border:1px solid var(--gold);border-radius:13px;outline:none;background:#f8f3e8;color:#102d24;font-size:24px;letter-spacing:10px;text-align:center;box-shadow:inset 0 1px 3px #0002}
input:focus{box-shadow:0 0 0 4px #dfbf7830}
button{font-family:inherit}
.primary-button,.secondary-button,.notice-close{min-height:50px;width:100%;border-radius:13px;font-weight:800;letter-spacing:.6px;cursor:pointer;transition:filter .18s,transform .18s}
.primary-button{margin-top:18px;padding:15px;border:1px solid #f2d99d;background:linear-gradient(135deg,#f0d493,#c9a65d);color:#10291e;font-size:15px;box-shadow:0 8px 20px #0003}
.primary-button:hover,.notice-close:hover{filter:brightness(1.06)}
.primary-button:active,.secondary-button:active{transform:scale(.99)}
.primary-button:disabled{opacity:.55;cursor:wait}
.secondary-button{margin-top:12px;padding:13px;border:1px solid #dfbf78a6;background:#ffffff08;color:var(--cream);font-size:13px}
.secondary-button:hover{background:#ffffff12}
.message{margin-top:17px;padding:13px;border:1px solid #dfbf7838;border-radius:12px;background:#071a1370;color:var(--cream);font-size:14px;line-height:1.55;text-align:center;overflow-wrap:anywhere}
.message:empty{display:none}
.small{margin:20px 0 0;color:#c9bea6;font-size:11px;line-height:1.7;text-align:center;letter-spacing:.25px}
.loading{padding:28px 5px;color:#e8dcc1;text-align:center;font-size:14px}
.selected-profile{padding:16px 12px 2px;margin:12px 0 8px;border:1px solid #dfbf7838;border-radius:16px;background:#071a1338}
.selected-profile .description{margin:10px 0 0;font-weight:700}
.selected-photo{margin-bottom:0}
.notice-modal-backdrop{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,.76);backdrop-filter:blur(6px)}
.notice-modal-backdrop.hidden{display:none}
.notice-modal{width:min(100%,520px);max-height:85vh;overflow:auto;background:var(--cream);color:#183e31;border:1px solid var(--gold);border-radius:20px;padding:22px;box-shadow:0 18px 55px #0008}
.notice-modal h2{margin-top:0;color:#102d24}
.notice-item{background:#fff;border-left:4px solid #c6a35d;border-radius:9px;padding:13px;margin:12px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.notice-item h3{margin:0 0 8px}
.notice-close{padding:13px;border:0;background:#102d24;color:var(--cream)}
@media(max-width:360px){body{padding-inline:10px}.staff-grid{gap:10px}.staff-card{min-height:146px;padding:14px 7px}.staff-photo{width:78px;height:78px}.brand{letter-spacing:1.8px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>

<body>
  <main class="container">

    <header class="header">
      <img id="staffBrandLogo" class="staff-brand-logo hidden" alt="Nababi Ristorante logo">
      <div id="staffBrandFallback">
        <div class="logo-mark">N</div>
        <h1 class="brand">NABABI RISTORANTE</h1>
      </div>
      <p class="subtitle" style="margin-top:6px">INDIAN FINE DINING · ROMA</p>
      <p class="subtitle">STAFF ATTENDANCE</p>
    </header>

    <section class="panel">

      <div id="staffView">
        <h2>Seleziona il tuo profilo</h2>
        <p class="description">
          Select your photo and name to continue.
        </p>

        <div id="loading" class="loading">
          Loading staff...
        </div>

        <div id="staffGrid" class="staff-grid"></div>
      </div>

      <div id="pinView" class="hidden">
        <h2>Verifica PIN</h2>
        <div class="selected-profile"><div id="selectedStaffPhoto" class="staff-photo selected-photo"></div><p id="selectedStaffName" class="description"></p></div>

        <form id="pinForm">
          <label class="field-label" for="pin">
            Inserisci il tuo PIN a 4 cifre
          </label>

          <input
            id="pin"
            type="password"
            inputmode="numeric"
            maxlength="4"
            pattern="[0-9]{4}"
            placeholder="••••"
            autocomplete="off"
            required
          >

          <button
            id="verifyButton"
            class="primary-button"
            type="submit"
          >
            VERIFICA PIN
          </button>
        </form>

        <div id="pinMessage" class="message" role="status"></div>

        <button
          id="backFromPin"
          class="secondary-button"
          type="button"
        >
          Torna indietro
        </button>
      </div>

      <div id="actionView" class="hidden">
        <h2 id="actionTitle">Attendance</h2>
        <p id="actionDescription" class="description"></p>

        <button
          id="actionButton"
          class="primary-button hidden"
          type="button"
        ></button>

        <div
          id="actionMessage"
          class="message"
          role="status"
          aria-live="polite"
        ></div>

        <button
          id="backToStaff"
          class="secondary-button"
          type="button"
        >
          Torna alla lista Staff
        </button>
      </div>

    </section>

    <div id="staffNoticeModal" class="notice-modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="staffNoticeHeading">
      <section class="notice-modal">
        <h2 id="staffNoticeHeading">Avvisi per lo staff · আজকের নির্দেশনা</h2>
        <div id="staffNoticeList"></div>
        <button id="staffNoticeClose" class="notice-close" type="button">পড়েছি · Close</button>
      </section>
    </div>

    <p class="small">
      Nababi Ristorante · Roma<br>
      Use your own staff profile and personal PIN.
    </p>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/js/config.js"></script>
  <script src="/assets/js/staff-qr.js"></script>
</body>
</html>
