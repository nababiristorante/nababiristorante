
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102d24">
  <title>Nababi Ristorante | Staff Attendance</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 16px 40px;
      background:
        radial-gradient(circle at top, #24503e 0%, #102d24 55%);
      color: #f7f1e5;
      font-family: Arial, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      padding: 22px 10px 28px;
    }

    .logo-mark {
      width: 64px;
      height: 64px;
      margin: 0 auto 13px;
      display: grid;
      place-items: center;
      border: 2px solid #d8b76a;
      border-radius: 50%;
      color: #d8b76a;
      font-family: Georgia, serif;
      font-size: 34px;
    }

    .notice-modal-backdrop { position:fixed; inset:0; z-index:1000; display:flex; align-items:center; justify-content:center; padding:18px; background:rgba(0,0,0,.72); }
    .notice-modal-backdrop.hidden { display:none; }
    .notice-modal { width:min(100%,520px); max-height:85vh; overflow:auto; background:#f7f1e5; color:#183e31; border:2px solid #d8b76a; border-radius:18px; padding:22px; box-shadow:0 18px 55px #0006; }
    .notice-modal h2 { margin-top:0; color:#102d24; }
    .notice-item { background:#fff; border-left:4px solid #d8b76a; border-radius:8px; padding:12px; margin:12px 0; white-space:pre-wrap; overflow-wrap:anywhere; }
    .notice-item h3 { margin:0 0 8px; }
    .notice-close { width:100%; padding:13px; border:0; border-radius:9px; background:#102d24; color:#f7f1e5; font-weight:bold; }
    .brand {
      margin: 0;
      color: #d8b76a;
      font-family: Georgia, serif;
      font-size: 27px;
      letter-spacing: 2px;
    }

    .subtitle {
      margin: 10px 0 0;
      color: #e8dcc1;
      font-size: 12px;
      letter-spacing: 2px;
    }

    .panel {
      padding: 24px 18px;
      border: 1px solid #d8b76a;
      border-radius: 18px;
      background: rgba(24, 62, 49, 0.96);
      box-shadow: 0 15px 40px rgba(0,0,0,.25);
    }

    h2 {
      margin: 0 0 8px;
      color: #d8b76a;
      text-align: center;
      font-size: 21px;
    }

    .description {
      margin: 0 0 23px;
      color: #e8dcc1;
      text-align: center;
      font-size: 14px;
      line-height: 1.6;
    }

    .staff-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 13px;
    }

    .staff-card {
      min-width: 0;
      padding: 14px 8px;
      border: 1px solid rgba(216,183,106,.55);
      border-radius: 13px;
      background: #102d24;
      color: #f7f1e5;
      cursor: pointer;
      text-align: center;
      transition: border-color .2s, background .2s;
    }

    .staff-card:active {
      background: #24503e;
    }

    .staff-card:hover {
      border-color: #d8b76a;
    }

    .staff-photo {
      width: 88px;
      height: 88px;
      margin: 0 auto 10px;
      display: grid;
      place-items: center;
      overflow: hidden;
      border: 2px solid #d8b76a;
      border-radius: 50%;
      background: #183e31;
      color: #d8b76a;
      font-size: 30px;
    }

    .staff-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .staff-name {
      display: block;
      overflow-wrap: anywhere;
      font-size: 14px;
      font-weight: bold;
    }

    .hidden {
      display: none !important;
    }

    .field-label {
      display: block;
      margin: 20px 0 8px;
      color: #f7f1e5;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 16px;
      border: 1px solid #d8b76a;
      border-radius: 10px;
      outline: none;
      background: #f7f1e5;
      color: #102d24;
      font-size: 22px;
      letter-spacing: 8px;
      text-align: center;
    }

    button {
      font-family: inherit;
    }

    .primary-button {
      width: 100%;
      margin-top: 18px;
      padding: 15px;
      border: 0;
      border-radius: 10px;
      background: #d8b76a;
      color: #102d24;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .primary-button:disabled {
      opacity: .55;
      cursor: wait;
    }

    .secondary-button {
      width: 100%;
      margin-top: 12px;
      padding: 13px;
      border: 1px solid #d8b76a;
      border-radius: 10px;
      background: transparent;
      color: #f7f1e5;
      font-size: 14px;
      cursor: pointer;
    }

    .message {
      margin-top: 17px;
      padding: 12px;
      border-radius: 9px;
      color: #f7f1e5;
      background: rgba(0,0,0,.16);
      font-size: 14px;
      line-height: 1.5;
      text-align: center;
      overflow-wrap: anywhere;
    }

    .message:empty {
      display: none;
    }

    .small {
      margin-top: 20px;
      color: #d6c9aa;
      font-size: 12px;
      line-height: 1.5;
      text-align: center;
    }

    .loading {
      padding: 25px 5px;
      color: #e8dcc1;
      text-align: center;
      font-size: 14px;
    }

    @media (max-width: 350px) {
      .staff-grid {
        grid-template-columns: 1fr;
      }

      .brand {
        font-size: 23px;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <header class="header">
      <div class="logo-mark">N</div>
      <h1 class="brand">NABABI RISTORANTE</h1>
      <p class="subtitle">STAFF ATTENDANCE</p>
    </header>

    <section class="panel">

      <div id="staffView">
        <h2>Seleziona il tuo profilo</h2>
        <p class="description">
          Select your photo and name to continue.
        </p>

        <div id="loading" class="loading">
          Loading staff...
        </div>

        <div id="staffGrid" class="staff-grid"></div>
      </div>

      <div id="pinView" class="hidden">
        <h2>Verifica PIN</h2>
        <p id="selectedStaffName" class="description"></p>

        <form id="pinForm">
          <label class="field-label" for="pin">
            Inserisci il tuo PIN a 4 cifre
          </label>

          <input
            id="pin"
            type="password"
            inputmode="numeric"
            maxlength="4"
            pattern="[0-9]{4}"
            placeholder="••••"
            autocomplete="off"
            required
          >

          <button
            id="verifyButton"
            class="primary-button"
            type="submit"
          >
            VERIFICA PIN
          </button>
        </form>

        <div id="pinMessage" class="message" role="status"></div>

        <button
          id="backFromPin"
          class="secondary-button"
          type="button"
        >
          Torna indietro
        </button>
      </div>

      <div id="actionView" class="hidden">
        <h2 id="actionTitle">Attendance</h2>
        <p id="actionDescription" class="description"></p>

        <button
          id="actionButton"
          class="primary-button hidden"
          type="button"
        ></button>

        <div
          id="actionMessage"
          class="message"
          role="status"
          aria-live="polite"
        ></div>

        <button
          id="backToStaff"
          class="secondary-button"
          type="button"
        >
          Torna alla lista Staff
        </button>
      </div>

    </section>

    <div id="staffNoticeModal" class="notice-modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="staffNoticeHeading">
      <section class="notice-modal">
        <h2 id="staffNoticeHeading">Avvisi per lo staff · আজকের নির্দেশনা</h2>
        <div id="staffNoticeList"></div>
        <button id="staffNoticeClose" class="notice-close" type="button">পড়েছি · Close</button>
      </section>
    </div>

    <p class="small">
      Nababi Ristorante · Roma<br>
      Use your own staff profile and personal PIN.
    </p>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/js/config.js"></script>
  <script src="/assets/js/staff-qr.js"></script>
</body>
</html>
