
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nababi Staff Attendance</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 24px;
      display: grid; place-items: center;
      background: #102d24; color: #f7f1e5;
      font-family: Arial, sans-serif;
    }
    .panel {
      width: 100%; max-width: 420px; padding: 28px;
      border: 1px solid #d8b76a; border-radius: 18px;
      background: #183e31;
    }
    h1 { color: #d8b76a; text-align: center; }
    p { text-align: center; line-height: 1.5; }
    label { display: block; margin: 20px 0 8px; }
    select, input, button {
      width: 100%; padding: 14px; border-radius: 9px;
      font-size: 16px;
    }
    select, input {
      border: 1px solid #d8b76a; background: #f7f1e5;
      color: #102d24;
    }
    button {
      margin-top: 22px; border: 0; cursor: pointer;
      background: #d8b76a; color: #102d24;
      font-weight: bold;
    }
    button:disabled { opacity: .6; cursor: wait; }
    #message {
      margin-top: 18px; padding: 12px; border-radius: 8px;
      text-align: center; overflow-wrap: anywhere;
    }
    .small { font-size: 13px; opacity: .8; }
  </style>
</head>
<body>
  <main class="panel">
    <h1>NABABI RISTORANTE</h1>
    <p>Staff Attendance<br>Registro entrata e uscita</p>

    <label for="staffSelect">Select your name</label>
    <select id="staffSelect">
      <option value="">Loading staff...</option>
    </select>

    <label for="pin">Your 4-digit PIN</label>
    <input id="pin" type="password" inputmode="numeric"
      maxlength="4" pattern="[0-9]{4}" placeholder="Enter PIN"
      autocomplete="off">

    <button id="punchButton" type="button" disabled>
      CHECK IN / CHECK OUT
    </button>

    <div id="message" role="status" aria-live="polite"></div>
    <p class="small">Use your own name and PIN.</p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/js/config.js"></script>
  <script src="/assets/js/staff-qr.js"></script>
</body>
</html>
