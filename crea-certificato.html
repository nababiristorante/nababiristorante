<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nababi Ristorante — Certificate Creator</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/config.js"></script>
<style>
:root{--green:#10251c;--gold:#d8b76a;--cream:#fffaf0;--wine:#76283d}*{box-sizing:border-box}body{margin:0;padding:22px;background:linear-gradient(135deg,#10251c,#203e2d);font-family:Arial,sans-serif;color:#fdf7e9}.wrap{max-width:850px;margin:auto}.head{text-align:center;color:var(--gold);letter-spacing:3px;font-weight:bold}.panel{margin:20px auto;padding:24px;background:#fffaf0;color:#241b12;border:1px solid #d8b76a;border-radius:18px;box-shadow:0 18px 55px #0005}.panel h1{text-align:center;color:var(--wine);margin:0 0 8px}.hint{text-align:center;color:#685d4d}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:6px;margin:12px 0}.field.full{grid-column:1/-1}label{font-weight:700;color:#46352a}input,select,textarea{width:100%;padding:12px;border:1px solid #c9b98e;border-radius:9px;font:inherit;background:#fff}textarea{min-height:110px;resize:vertical}.upload{padding:12px;background:#f6efdf;border:1px dashed #b99b5d;border-radius:9px}.btn{display:block;width:100%;padding:14px;border:0;border-radius:10px;background:var(--wine);color:white;font-weight:bold;font-size:16px;cursor:pointer}.btn:disabled{opacity:.6}.status{margin:12px 0;padding:12px;border-radius:8px;background:#f2e8cf;color:#49391f}.cert{display:none;margin:24px auto;background:#fffaf0;color:#33251d;border:12px double #b88b39;padding:28px;text-align:center;min-height:175mm;position:relative}.cert h2{color:var(--wine);letter-spacing:3px}.cert img.logo{max-width:180px;max-height:70px;object-fit:contain}.cert .name{font:italic 34px Georgia;color:var(--wine);padding:12px}.cert .photos{display:flex;justify-content:center;gap:15px}.cert .photos img{width:105px;height:105px;border-radius:50%;object-fit:cover;border:3px solid #b88b39}.cert .copy{font:16px/1.7 Georgia;max-width:700px;margin:16px auto}.cert .bottom{margin-top:45px;display:flex;justify-content:space-between;align-items:end;gap:12px}.cert .bottom img{max-width:140px;max-height:60px;object-fit:contain}.actions{display:none;margin:12px auto}.actions button{padding:12px 18px;background:var(--gold);border:0;border-radius:8px;font-weight:bold}@media(max-width:600px){.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.panel{padding:16px}.cert{padding:18px 10px}.cert .bottom{flex-direction:column;align-items:center}.cert .name{font-size:26px}}@media print{@page{size:A4 landscape;margin:8mm}body{background:white;padding:0}.head,.panel,.actions{display:none!important}.cert{display:block!important;margin:0;min-height:185mm;box-shadow:none;print-color-adjust:exact;-webkit-print-color-adjust:exact}}
</style></head>
<body><main class="wrap"><div class="head">♛ NABABI RISTORANTE ♛</div><section class="panel">
<h1>সার্টিফিকেট তৈরি করুন</h1><p class="hint">একই ফর্মে তথ্য, ছবি, লোগো ও সিগনেচার যোগ করুন</p>
<form id="form"><div class="grid">
<div class="field"><label for="type">সার্টিফিকেটের ধরন</label><select id="type"><option value="birthday">Birthday / জন্মদিন</option><option value="event">Event / অনুষ্ঠান</option></select></div>
<div class="field"><label for="date">তারিখ</label><input id="date" type="date" required></div>
<div class="field"><label for="name">যার জন্য সার্টিফিকেট</label><input id="name" maxlength="140" required placeholder="সম্পূর্ণ নাম"></div>
<div class="field" id="eventWrap" hidden><label for="event">অনুষ্ঠানের নাম</label><input id="event" placeholder="অনুষ্ঠানের নাম"></div>
<div class="field full"><label for="greeting">শুভেচ্ছাবার্তা (ধরন অনুযায়ী স্বয়ংক্রিয়; চাইলে সম্পাদনা করুন)</label><textarea id="greeting"></textarea></div>
<div class="field" id="singlePhotoWrap"><label for="photo">ব্যক্তির ছবি</label><input class="upload" id="photo" type="file" accept="image/png,image/jpeg,image/webp"></div>
<div class="field" id="leftPhotoWrap" hidden><label for="photoLeft">বরের ছবি</label><input class="upload" id="photoLeft" type="file" accept="image/png,image/jpeg,image/webp"></div>
<div class="field" id="rightPhotoWrap" hidden><label for="photoRight">কনের ছবি</label><input class="upload" id="photoRight" type="file" accept="image/png,image/jpeg,image/webp"></div>
<div class="field"><label for="logo">এই সার্টিফিকেটের লোগো</label><input class="upload" id="logo" type="file" accept="image/png,image/jpeg,image/webp"></div>
<div class="field"><label for="signature">মালিকের সিগনেচার</label><input class="upload" id="signature" type="file" accept="image/png,image/jpeg,image/webp"></div>
<div class="field"><label for="signer">স্বাক্ষরকারীর নাম</label><input id="signer" value="Nababi Ristorante"></div>
<div class="field"><label for="role">পদবি</label><input id="role" value="Direzione"></div>
</div><div id="status" class="status" role="status">প্রথমে অ্যাডমিন হিসেবে লগইন করুন।</div><button class="btn" id="submit" type="submit">সার্টিফিকেট তৈরি করুন</button></form></section>
<article class="cert" id="cert"><img class="logo" id="outLogo" hidden><h2 id="outTitle"></h2><p>সশ্রদ্ধ শুভেচ্ছা জানানো হচ্ছে</p><div class="name" id="outName"></div><div class="photos" id="outPhotos"></div><div class="copy" id="outCopy"></div><div class="bottom"><div><b>তারিখ</b><br><span id="outDate"></span><br><b>সার্টিফিকেট নম্বর</b><br><span id="outCode"></span></div><div><img id="outSignature" hidden><br><b id="outSigner"></b><br>মালিকের স্বাক্ষর</div></div></article><div class="actions" id="actions"><button type="button" onclick="window.print()">Print / Save PDF</button> <a id="verifyLink" style="color:#fff" target="_blank">Verify certificate</a></div>
</main><script>
(()=>{const cfg=window.NABABI_CONFIG||{},db=window.supabase&&cfg.SUPABASE_URL?window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY):null,$=id=>document.getElementById(id);
const defaults={birthday:'Nababi Ristorante-এর পক্ষ থেকে আপনাকে জন্মদিনের আন্তরিক শুভেচ্ছা। আপনার জীবন আনন্দ, ভালোবাসা ও সাফল্যে ভরে উঠুক। ইতালিতে বসবাসকারী সকলের জন্য রইল আমাদের শুভকামনা।',event:'Nababi Ristorante-এর পক্ষ থেকে এই বিশেষ অনুষ্ঠানে আপনাকে ও আপনার পরিবারকে আন্তরিক অভিনন্দন ও শুভেচ্ছা।'};
function sync(){const event=$('type').value==='event';$('eventWrap').hidden=!event;$('singlePhotoWrap').hidden=event;$('leftPhotoWrap').hidden=!event;$('rightPhotoWrap').hidden=!event;$('greeting').value=defaults[$('type').value];}
$('type').addEventListener('change',sync);sync();
async function upload(file,label){if(!file)return null;if(!['image/png','image/jpeg','image/webp'].includes(file.type)||file.size>4*1024*1024)throw Error(label+': PNG/JPG/WEBP ছবি ৪ MB-এর মধ্যে হতে হবে।');const ext=file.type==='image/png'?'png':file.type==='image/webp'?'webp':'jpg',path='certificates/'+Date.now()+'-'+Math.random().toString(36).slice(2)+'.'+ext;const {error}=await db.storage.from('nababi-certificates').upload(path,file,{contentType:file.type,upsert:false});if(error)throw error;return db.storage.from('nababi-certificates').getPublicUrl(path).data.publicUrl;}
$('form').addEventListener('submit',async e=>{e.preventDefault();const btn=$('submit');btn.disabled=true;$('status').textContent='সার্টিফিকেট তৈরি হচ্ছে…';try{if(!db)throw Error('Supabase সংযোগ পাওয়া যায়নি।');const {data:{session}}=await db.auth.getSession();if(!session)throw Error('প্রথমে অ্যাডমিন অ্যাকাউন্টে লগইন করুন।');const type=$('type').value,isEvent=type==='event';if(isEvent&&!$('event').value.trim())throw Error('অনুষ্ঠানের নাম লিখুন।');const [photo,photoLeft,photoRight,logo,signature]=await Promise.all([upload($('photo').files[0],'ছবি'),upload($('photoLeft').files[0],'বরের ছবি'),upload($('photoRight').files[0],'কনের ছবি'),upload($('logo').files[0],'লোগো'),upload($('signature').files[0],'সিগনেচার')]);const row={certificate_type:type,recipient_name:$('name').value.trim(),event_name:isEvent?$('event').value.trim():null,issue_date:$('date').value,dedication:$('greeting').value.trim(),photo_url:photo,photo_url_left:photoLeft,photo_url_right:photoRight,logo_url:logo,signature_url:signature,signer_name:$('signer').value.trim()||'Nababi Ristorante',signer_role:$('role').value.trim(),show_photo_publicly:true,created_by:session.user.id};const {data,error}=await db.from('nababi_certificates').insert(row).select('certificate_code').single();if(error)throw error;$('outLogo').hidden=!logo;if(logo)$('outLogo').src=logo;$('outTitle').textContent=isEvent?'CERTIFICATO PER EVENTO':'CERTIFICATO DI COMPLEANNO';$('outName').textContent=row.recipient_name;$('outCopy').textContent=row.dedication;$('outDate').textContent=new Date(row.issue_date+'T12:00:00').toLocaleDateString('it-IT');$('outCode').textContent=data.certificate_code;$('outSigner').textContent=[row.signer_name,row.signer_role].filter(Boolean).join(' · ');$('outSignature').hidden=!signature;if(signature)$('outSignature').src=signature;$('outPhotos').replaceChildren();for(const url of (isEvent?[photoLeft,photoRight]:[photo]))if(url){const img=document.createElement('img');img.src=url;$('outPhotos').append(img);}$('cert').style.display='block';$('actions').style.display='block';$('verifyLink').href='verifica-certificato.html?code='+encodeURIComponent(data.certificate_code);$('status').textContent='সার্টিফিকেট তৈরি হয়েছে। নম্বর: '+data.certificate_code;}catch(err){console.error(err);$('status').textContent=err.message||'সার্টিফিকেট তৈরি করা যায়নি।';}finally{btn.disabled=false;}});
})();
</script></body></html>
